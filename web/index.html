<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知乎热搜榜 · 历史回溯（2020-11-24 起）</title>
    <meta name="description"
      content="浏览任意一天知乎热搜榜，检索任意关键词历史上哪些天上榜。数据自 2020-11-24 起。">
    <link rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='3' fill='%239c1c16'/%3E%3Ctext x='16' y='22' text-anchor='middle' fill='%23f3ead8' font-size='16' font-family='serif'%3E%E7%83%AD%3C/text%3E%3C/svg%3E">
    <style>
    :root {
      --bg: #f3ead8;
      --fg: #1a1510;
      --muted: #6e6256;
      --rule: #2a2118;
      --border: rgba(42, 33, 24, 0.16);
      --card: #efe4ce;
      --accent: #9c1c16;
      --accent-weak: #f0d6c8;
      --rank: #9c1c16;
      --rank-2: #b85a1a;
      --rank-3: #8a6a18;
      --radius: 2px;
      --gutter: clamp(12px, 2.5vw, 28px);
      --display: "Iowan Old Style", "Palatino Linotype", Palatino, "Songti SC",
        "STSong", "Noto Serif SC", serif;
      --sans: "PingFang SC", "Hiragino Sans GB", "Source Han Sans SC",
        "Noto Sans SC", "Microsoft YaHei", sans-serif;
      --mono: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
    }
    :root[data-theme="dark"] {
      --bg: #1b1610;
      --fg: #efe6d4;
      --muted: #a89884;
      --rule: #c4b49a;
      --border: rgba(239, 230, 212, 0.14);
      --card: #241e16;
      --accent: #e07060;
      --accent-weak: #3a221c;
      --rank: #e07060;
      --rank-2: #e09a5a;
      --rank-3: #c4b06a;
    }
    * {
      box-sizing: border-box;
    }
    html {
      color-scheme: light dark;
      -webkit-font-smoothing: antialiased;
      overflow-x: clip;
    }
    body {
      margin: 0;
      min-height: 100vh;
      width: 100%;
      max-width: 100%;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.65 var(--sans);
      padding: 8px var(--gutter) 48px;
      overflow-x: clip;
    }
    body::before {
      content: "";
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 0;
      opacity: 0.28;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/%3E%3C/svg%3E");
    }
    :root[data-theme="dark"] body::before {
      opacity: 0.16;
    }
    .wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
    }
    #app {
      animation: rise 0.45s cubic-bezier(0.2, 0, 0, 1);
    }
    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    header {
      border-top: 2px solid var(--rule);
      border-bottom: 1px solid var(--rule);
    }
    .masthead {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px 14px;
      padding: 8px 0;
      min-width: 0;
    }
    header .kicker {
      order: 2;
      margin: 0;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      color: var(--muted);
      white-space: nowrap;
    }
    header h1 {
      order: 1;
      margin: 0;
      font-family: var(--display);
      font-size: clamp(1.1rem, 2.4vw, 1.35rem);
      font-weight: 600;
      letter-spacing: 0.2em;
      text-indent: 0.2em;
      line-height: 1.2;
      text-wrap: balance;
      white-space: nowrap;
    }
    header .sub {
      display: none;
    }
    .stats {
      order: 3;
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 4px 14px;
      margin-left: auto;
      color: var(--muted);
      font-size: 0.78rem;
    }
    .stat {
      display: inline-flex;
      align-items: baseline;
      gap: 4px;
      min-width: 0;
    }
    .stat .lbl {
      letter-spacing: 0.08em;
    }
    .stat b {
      color: var(--fg);
      font-family: var(--display);
      font-size: 0.92rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .stat .unit {
      font-size: 0.72rem;
    }

    .tabs {
      display: flex;
      justify-content: flex-start;
      gap: 4px;
      margin: 12px 0 12px;
    }
    .tabs button {
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      min-height: 40px;
      padding: 8px 18px;
      font: inherit;
      cursor: pointer;
      letter-spacing: 0.08em;
    }
    .tabs button[aria-selected="true"] {
      color: var(--fg);
      border-color: var(--rule);
      background: var(--card);
    }
    .tabs button:hover {
      color: var(--fg);
    }
    .tabs button:focus-visible,
    button.btn:focus-visible,
    input:focus-visible,
    .theme-toggle:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .controls input[type="date"],
    .controls input[type="search"] {
      min-width: 0;
      min-height: 40px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
      color: var(--fg);
      font: inherit;
    }
    #date-input {
      width: auto;
      flex: 0 1 16em;
    }
    #search .controls input {
      width: 100%;
      flex: 1 1 auto;
    }
    button.btn {
      min-height: 40px;
      padding: 8px 14px;
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      background: transparent;
      color: var(--fg);
      font: inherit;
      cursor: pointer;
      transition-property: transform, background-color;
      transition-duration: 120ms;
      transition-timing-function: cubic-bezier(0.2, 0, 0, 1);
    }
    button.btn:hover {
      background: var(--card);
    }
    button.btn:active {
      transform: scale(0.96);
    }
    button.btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none;
    }

    ol.list {
      list-style: none;
      padding: 0;
      margin: 0;
      counter-reset: rank;
    }
    ol.list > li {
      counter-increment: rank;
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px 14px;
      padding: 10px 4px;
      border-bottom: 1px solid var(--border);
      min-width: 0;
    }
    ol.list > li::before {
      content: counter(rank, decimal-leading-zero);
      min-width: 1.8em;
      font-family: var(--display);
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--muted);
      text-align: right;
    }
    ol.list > li:nth-child(1)::before {
      color: var(--rank);
    }
    ol.list > li:nth-child(2)::before {
      color: var(--rank-2);
    }
    ol.list > li:nth-child(3)::before {
      color: var(--rank-3);
    }
    ol.list a {
      flex: 0 1 auto;
      min-width: 0;
      color: var(--fg);
      text-decoration: none;
      overflow-wrap: anywhere;
    }
    ol.list a:hover {
      color: var(--accent);
    }
    ol.list .badge {
      flex: 0 0 auto;
      font-size: 0.75rem;
      color: var(--muted);
      font-family: var(--mono);
      white-space: nowrap;
    }

    .result {
      padding: 10px 4px;
      border-bottom: 1px solid var(--border);
      min-width: 0;
    }
    .result a {
      color: var(--fg);
      text-decoration: none;
    }
    .result a:hover {
      color: var(--accent);
    }
    .result .meta {
      color: var(--muted);
      font-size: 0.78rem;
      margin-top: 3px;
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
    }

    .section-title {
      margin: 32px 0 8px;
      font-family: var(--display);
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--muted);
    }
    .hint {
      color: var(--muted);
      font-size: 0.85rem;
      padding: 8px 0;
    }

    #loading,
    #error {
      text-align: center;
      padding: 80px 16px;
      color: var(--muted);
    }
    #error {
      color: var(--accent);
    }
    .spinner {
      width: 22px;
      height: 22px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      margin: 0 auto 12px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .theme-toggle {
      appearance: none;
      order: 4;
      flex: 0 0 auto;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      min-width: 40px;
      min-height: 40px;
      padding: 0 10px;
      font: inherit;
      font-size: 0.78rem;
      letter-spacing: 0.16em;
      cursor: pointer;
    }
    .theme-toggle:hover {
      color: var(--fg);
      border-color: var(--rule);
    }
    footer {
      margin-top: 48px;
      padding-top: 16px;
      border-top: 1px solid var(--rule);
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.8;
    }
    footer a {
      color: var(--muted);
    }
    footer a:hover {
      color: var(--fg);
    }

    @media (max-width: 860px) {
      .masthead {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-areas:
          "title theme"
          "stats stats";
        align-items: center;
        column-gap: 8px;
        row-gap: 4px;
      }
      header h1 {
        grid-area: title;
        letter-spacing: 0.12em;
        text-indent: 0.12em;
      }
      header .kicker {
        display: none;
      }
      .stats {
        grid-area: stats;
        margin-left: 0;
      }
      .theme-toggle {
        grid-area: theme;
        margin-left: 0;
      }
    }
    @media (max-width: 480px) {
      #browse .controls {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-areas:
          "date date"
          "prev next";
      }
      #date-input {
        grid-area: date;
        width: 100%;
        flex: none;
      }
      #prev-day {
        grid-area: prev;
      }
      #next-day {
        grid-area: next;
      }
    }
    </style>
  </head>
  <body>
    <div class="wrap" hidden id="app">
      <header>
        <div class="masthead">
          <h1>知乎热搜榜</h1>
          <p class="kicker">自 2020 · 11 · 24　每小时归档</p>
          <div class="stats">
            <span class="stat">
              <span class="lbl">归档</span>
              <b id="stat-days">-</b>
              <span class="unit">天</span>
            </span>
            <span class="stat">
              <span class="lbl">词条</span>
              <b id="stat-entries">-</b>
              <span class="unit">条</span>
            </span>
            <span class="stat">
              <span class="lbl">起止</span>
              <b id="stat-range">-</b>
            </span>
          </div>
          <button class="theme-toggle" id="theme-toggle" type="button"
            aria-label="切换主题">夜</button>
        </div>
      </header>

      <div class="tabs" role="tablist">
        <button role="tab" id="tab-browse" aria-selected="true"
          aria-controls="browse" tabindex="0" type="button">按日期浏览</button>
        <button role="tab" id="tab-search" aria-selected="false"
          aria-controls="search" tabindex="-1" type="button">关键词检索</button>
      </div>

      <section id="browse" role="tabpanel" aria-labelledby="tab-browse">
        <div class="controls">
          <button class="btn" id="prev-day" type="button"
            title="上一天（←）">上一天</button>
          <input type="date" id="date-input" aria-label="选择日期">
          <button class="btn" id="next-day" type="button"
            title="下一天（→）">下一天</button>
        </div>
        <h2 class="section-title" id="browse-title">加载中…</h2>
        <ol class="list" id="browse-list"></ol>

        <h3 class="section-title">历史上的今天</h3>
        <div class="hint" id="onthisday-empty"
          hidden>该日暂无其它年份数据。</div>
        <ol class="list" id="onthisday-list"
          style="counter-reset: rank 0;"></ol>
      </section>

      <section id="search" role="tabpanel" aria-labelledby="tab-search" hidden>
        <div class="controls">
          <input type="search" id="search-input"
            placeholder="输入关键词，如「苹果」「疫情」「嫦娥」"
            aria-label="搜索关键词">
        </div>
        <div class="hint"
          id="search-hint">输入至少一个字符开始检索（在标题与搜索词字段中匹配）。</div>
        <h2 class="section-title" id="search-title" hidden></h2>
        <div id="search-list"></div>
      </section>

      <footer>
        每小时抓一次知乎热搜接口，按天归档。源码
        <a href="https://github.com/qcmuu/zhihu-trending-top-search">qcmuu/zhihu-trending-top-search</a>。
        采集思路来自
        <a href="https://github.com/justjavac/zhihu-trending-top-search">justjavac</a>。
        <br>本页无后端，索引加载后全部在浏览器里算。
      </footer>
    </div>

    <div
      id="loading"><div class="spinner"></div>正在加载索引（约 700KB，gzip）…</div>
    <div id="error" hidden>加载失败，请稍后重试。</div>

    <script type="module">
    import {
      formatDateCN,
      formatRelativeYear,
      loadIndex,
      nearestDate,
      onThisDay,
      searchIndex,
      sortedDates,
      stepDate,
    } from "./app.js";

    const INDEX_URL = "./index.json";
    const $ = (id) => document.getElementById(id);

    let INDEX = null;
    let DATES = [];
    const state = { tab: "browse", currentDate: null };

    function setThemeLabel(theme) {
      $("theme-toggle").textContent = theme === "dark" ? "昼" : "夜";
    }

    function renderBrowse(date) {
      const list = INDEX.days[date] || [];
      state.currentDate = date;
      $("date-input").value = date;
      $("browse-title").textContent = `${
        formatDateCN(date)
      } · 共 ${list.length} 条`;
      const el = $("browse-list");
      el.innerHTML = "";
      if (list.length === 0) {
        el.innerHTML = `<li class="hint">该日期无归档数据。</li>`;
      } else {
        for (const [display, query] of list) {
          const li = document.createElement("li");
          const a = document.createElement("a");
          a.href = `https://www.zhihu.com/search?q=${encodeURIComponent(query)}`;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.textContent = display;
          li.appendChild(a);
          el.appendChild(li);
        }
      }
      const ot = onThisDay(INDEX, date).sort((a, b) =>
        b.date.localeCompare(a.date)
      );
      const otEl = $("onthisday-list");
      otEl.innerHTML = "";
      $("onthisday-empty").hidden = ot.length > 0;
      for (const item of ot) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = `https://www.zhihu.com/search?q=${encodeURIComponent(item.query)}`;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = item.display;
        li.appendChild(a);
        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = `${item.date} · ${formatRelativeYear(item.yearsAgo)}`;
        li.appendChild(badge);
        otEl.appendChild(li);
      }
      const ix = DATES.indexOf(date);
      $("prev-day").disabled = ix <= 0;
      $("next-day").disabled = ix >= DATES.length - 1;
    }

    let searchTimer = null;
    function renderSearch(keyword) {
      const out = $("search-list");
      const titleEl = $("search-title");
      const hintEl = $("search-hint");
      out.innerHTML = "";
      if (!keyword || keyword.trim() === "") {
        titleEl.hidden = true;
        hintEl.hidden = false;
        return;
      }
      hintEl.hidden = true;
      const results = searchIndex(INDEX, keyword.trim());
      titleEl.hidden = false;
      titleEl.textContent = `共命中 ${results.length} 次`;
      if (results.length === 0) {
        const empty = document.createElement("div");
        empty.className = "hint";
        empty.textContent = `未找到包含「${keyword}」的热搜。`;
        out.appendChild(empty);
        return;
      }
      const CAP = 500;
      const shown = results.slice(0, CAP);
      const frag = document.createDocumentFragment();
      for (const r of shown) {
        const row = document.createElement("div");
        row.className = "result";
        const a = document.createElement("a");
        a.href = `https://www.zhihu.com/search?q=${encodeURIComponent(r.query)}`;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = r.display;
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = `${r.date} · 当日第 ${r.rank} 名`;
        row.appendChild(a);
        row.appendChild(meta);
        frag.appendChild(row);
      }
      out.appendChild(frag);
      if (results.length > CAP) {
        const more = document.createElement("div");
        more.className = "hint";
        more.textContent =
          `仅显示前 ${CAP} 条，共 ${results.length} 次命中，请缩小范围。`;
        out.appendChild(more);
      }
    }

    function switchTab(name) {
      state.tab = name;
      $("tab-browse").setAttribute("aria-selected", String(name === "browse"));
      $("tab-search").setAttribute("aria-selected", String(name === "search"));
      $("tab-browse").tabIndex = name === "browse" ? 0 : -1;
      $("tab-search").tabIndex = name === "search" ? 0 : -1;
      $("browse").hidden = name !== "browse";
      $("search").hidden = name !== "search";
      if (name === "search") $("search-input").focus();
    }

    function handleTabKeydown(e) {
      const tabs = ["browse", "search"];
      let ix = tabs.indexOf(state.tab);
      if (e.key === "ArrowRight") ix = (ix + 1) % tabs.length;
      else if (e.key === "ArrowLeft") ix = (ix - 1 + tabs.length) % tabs.length;
      else if (e.key === "Home") ix = 0;
      else if (e.key === "End") ix = tabs.length - 1;
      else return;

      e.preventDefault();
      const name = tabs[ix];
      switchTab(name);
      $(`tab-${name}`).focus();
    }

    function step(delta) {
      const next = stepDate(INDEX, state.currentDate, delta);
      if (next) renderBrowse(next);
    }

    async function main() {
      try {
        INDEX = await loadIndex(INDEX_URL);
      } catch (e) {
        console.error(e);
        $("loading").hidden = true;
        $("error").hidden = false;
        return;
      }
      DATES = sortedDates(INDEX);
      $("loading").hidden = true;
      $("app").hidden = false;

      $("stat-days").textContent = INDEX.meta.days.toLocaleString();
      $("stat-entries").textContent = INDEX.meta.entries.toLocaleString();
      const startY = (INDEX.meta.start || "").slice(0, 4);
      const endY = (INDEX.meta.end || "").slice(0, 4);
      $("stat-range").textContent = startY && endY ? `${startY}–${endY}` : "—";

      renderBrowse(INDEX.meta.end);

      $("tab-browse").addEventListener("click", () => switchTab("browse"));
      $("tab-search").addEventListener("click", () => switchTab("search"));
      $("tab-browse").addEventListener("keydown", handleTabKeydown);
      $("tab-search").addEventListener("keydown", handleTabKeydown);

      $("prev-day").addEventListener("click", () => step(-1));
      $("next-day").addEventListener("click", () => step(+1));
      $("date-input").addEventListener("change", (e) => {
        const want = e.target.value;
        const adj = INDEX.days[want]
          ? want
          : nearestDate(INDEX, want, want > (state.currentDate || "") ? -1 : +1);
        renderBrowse(adj || INDEX.meta.end);
      });

      const si = $("search-input");
      si.addEventListener("input", () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => renderSearch(si.value), 150);
      });

      document.addEventListener("keydown", (e) => {
        if (
          e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey
        ) {
          return;
        }
        if (
          e.target instanceof Element &&
          e.target.closest("input, button, select, textarea, a, [contenteditable]")
        ) return;
        if (state.tab !== "browse") return;
        if (e.key === "ArrowLeft") {
          e.preventDefault();
          step(-1);
        }
        if (e.key === "ArrowRight") {
          e.preventDefault();
          step(+1);
        }
      });

      const savedTheme = localStorage.getItem("theme");
      if (savedTheme) document.documentElement.dataset.theme = savedTheme;
      $("theme-toggle").addEventListener("click", () => {
        const cur = document.documentElement.dataset.theme || "light";
        const next = cur === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = next;
        localStorage.setItem("theme", next);
        setThemeLabel(next);
      });
      setThemeLabel(document.documentElement.dataset.theme || "light");
    }

    main();
    </script>
  </body>
</html>
